<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillLink</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--side:#0f3b3f;--side2:#164c4e;--ink:#0d3338;--mut:#5d7476;--bg:#f3f6f4;--card:#fffdf9;--acc:#16766b;--mint:#7fe0b0;--warn:#e2873b;--bad:#c4452f;--line:#dfe6e2}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:260px;background:var(--side);color:#cfe5e0;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h1{margin:0 0 18px 8px;font-size:26px;color:#fff}aside h1 small{display:block;font:11px monospace;letter-spacing:.12em;color:#8fb5ae}
nav button{all:unset;display:block;width:100%;padding:13px 14px;border-radius:8px;cursor:pointer;box-sizing:border-box}nav button.on{background:var(--side2);outline:1px solid #2b6b68;color:#fff}nav button:focus-visible{outline:2px solid var(--mint)}
.sim{margin-top:auto;border:1px solid #2b6b68;border-radius:10px;padding:14px;font-size:13px}.sim b{color:#fff}
main{flex:1;padding:28px 36px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
header h2{margin:0;font-size:32px;letter-spacing:-.02em}.pill{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:6px}.off .dot{background:var(--bad)}
.hero{background:#174b4f;color:#fff;border-radius:14px;padding:34px 40px;margin-bottom:20px}.hero h3{font-size:42px;line-height:1.05;margin:0 0 12px;letter-spacing:-.03em}.hero h3 span{color:var(--mint)}.hero p{max-width:560px;color:#d4e8e3}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:13px 20px;font:600 16px inherit;cursor:pointer;min-height:48px}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.btn.sm{min-height:0;padding:5px 10px;font-size:14px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card h4{margin:0 0 4px;font-size:18px}.num{font-size:36px;font-weight:700}.mut{color:var(--mut);font-size:13px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}input,select{width:100%;padding:12px;border:1px solid #c8d4cf;border-radius:8px;font:inherit;background:#fff;min-height:48px}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:#e3efe9}.tag.demo{background:#fbe5d0;color:#8a4a10}.tag.ok{background:#d5f1e1}.tag.bad{background:#f6d9d3}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#map{height:380px;border-radius:12px;border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.note{background:#fff3e3;border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.req{border-top:1px solid var(--line);padding:12px 0}
@media(max-width:800px){body{display:block}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}aside h1,.sim{display:none}nav{display:flex;flex-wrap:wrap}main{padding:16px}.hero h3{font-size:30px}}
</style></head><body>
<aside><h1>HillLink<small>FIELD COORDINATION</small></h1><nav id="nav"></nav><div class="sim"><b>Simulation only</b><br>Mock SMS, synthetic people, no real dispatch. Verification and approvals are fictional until real providers are connected.</div></aside>
<main><header><div><div class="mut">Regional response / Arunachal Pradesh</div><h2 id="title">Emergency overview</h2></div>
<div class="row" style="margin:0"><span class="pill" id="conn"><span class="dot"></span><span>Starting…</span></span><span class="pill">Role <select id="role" style="width:auto;min-height:0;padding:2px"><option value="demo-hospital">hospital</option><option value="demo-dispatcher">dispatcher</option><option value="demo-admin">admin</option></select></span></div></header>
<div id="view"></div></main>
<script>
const KEYS={'demo-hospital':'hospital','demo-dispatcher':'dispatcher','demo-admin':'admin'};
//ENGINE-START  (browser backend: same rules as server.js, data kept in localStorage; synthetic only)
const NODES=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)NODES.push({id:r*3+c,lat:27.1-r*.015,lon:93.59+c*.02});NODES.push({id:9,lat:27.2,lon:93.7});
const HN=4,SPEED={highway:40,local:25,hill:15},BATCH=2,TIMEOUT_MIN=10,INTERVAL={whole_blood:90,packed_red_cells:90,platelets:14,plasma:28};
const hav=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);return 12742*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2))};
const mkEdges=()=>[[0,1,'highway'],[1,2,'hill'],[3,4,'local'],[4,5,'local'],[6,7,'hill'],[7,8,'highway'],[0,3,'local'],[3,6,'hill'],[1,4,'highway'],[4,7,'local'],[2,5,'hill'],[5,8,'local']].map(([a,b,type])=>({id:`${a}-${b}`,a,b,type,km:+(hav(NODES[a],NODES[b])*1.3).toFixed(2),closed:false,rain:0}));
const seed=()=>({donors:[['A','O-',0],['B','O+',1],['C','B+',2],['D','B+',5],['E','A+',6],['F','AB-',7],['G','B-',8],['H','B+',3]].map(([n,g,nd],i)=>({id:'D'+(i+1),name:'Demo donor '+n,phone:'+9100000000'+(10+i),group:g,node:nd,available:i!==3,consent:i!==6,lastDonationDays:i===1?20:120+i*10,screened:i!==4,locConfidence:i%3?'high':'low',components:Object.keys(INTERVAL),reservedFor:null})),
 ambulances:[{id:'AMB1',name:'Demo ambulance 1',node:0,available:true,assignedTo:null},{id:'AMB2',name:'Demo ambulance 2',node:8,available:true,assignedTo:null}],requests:[],outreach:[],outbox:[],audit:[],idem:{},edges:mkEdges()});
let D;try{D=JSON.parse(localStorage.hlDB||'null')}catch(e){}D=D||seed();
const save=()=>localStorage.hlDB=JSON.stringify(D);
const log=(actor,action,ref,detail)=>{D.audit.unshift({at:new Date().toISOString(),actor,action,ref,detail});D.audit.length=Math.min(D.audit.length,300)};
const edgeMin=e=>e.km/SPEED[e.type]*60*(1+1.5*e.rain)*(e.type==='hill'?1.2:1);
function dijkstra(src,dst){const dist={},prev={},done=new Set();NODES.forEach(n=>dist[n.id]=Infinity);dist[src]=0;
 while(true){let u=null;for(const n of NODES)if(!done.has(n.id)&&dist[n.id]<(u===null?Infinity:dist[u]))u=n.id;if(u===null||dist[u]===Infinity||u===dst)break;done.add(u);
  for(const e of D.edges){if(e.closed)continue;const v=e.a===u?e.b:e.b===u?e.a:null;if(v===null)continue;const w=dist[u]+edgeMin(e);if(w<dist[v]){dist[v]=w;prev[v]={u,e}}}}
 if(dist[dst]===Infinity)return null;const nodes=[dst],used=[];for(let c=dst;c!==src;c=prev[c].u){nodes.unshift(prev[c].u);used.push(prev[c].e)}
 return{minutes:+dist[dst].toFixed(1),km:+used.reduce((s,e)=>s+e.km,0).toFixed(2),nodes,path:nodes.map(i=>[NODES[i].lat,NODES[i].lon]),estimate:true,at:new Date().toISOString()}}
const nearest=p=>NODES.slice(0,9).reduce((b,n)=>hav(p,n)<hav(p,b)?n:b).id;
const sp=g=>({abo:g.replace(/[+-]/,''),rh:g.slice(-1)}),aboOK=(d,r)=>d==='O'||d===r||r==='AB';
function compatible(dg,rg,comp){const d=sp(dg),r=sp(rg);if(comp==='platelets')return{ok:true,note:'Platelets: ABO matching preferred; blood bank decides'};if(comp==='plasma')return{ok:aboOK(r.abo,d.abo)};return{ok:aboOK(d.abo,r.abo)&&(d.rh==='-'||r.rh==='+')}}
const sendSms=(to,body)=>D.outbox.unshift({at:new Date().toISOString(),to,body,mock:true,delivered:false});
const expire=()=>{D.requests.forEach(r=>{if(!['completed','cancelled','expired'].includes(r.status)&&new Date(r.deadline)<Date.now()){r.status='expired';log('system','expired',r.id)}})};
function matches(r){const hosp=nearest(r.coords),left=(new Date(r.deadline)-Date.now())/6e4;
 return D.donors.map(d=>{const reasons=[],missing=[],c=compatible(d.group,r.bloodGroup,r.component);
  if(!c.ok||!d.consent||!d.available||(d.reservedFor&&d.reservedFor!==r.id)||!d.components.includes(r.component)||d.lastDonationDays<INTERVAL[r.component])return null;
  reasons.push('Group/component compatible (listed rule only)');if(c.note)reasons.push(c.note);reasons.push(`Last donation ${d.lastDonationDays}d ago`);
  if(!d.screened)missing.push('No recent health screening confirmation');if(d.locConfidence==='low')missing.push('Low-confidence location');
  const route=dijkstra(d.node,hosp),mins=route?route.minutes:null;
  return{donor:{id:d.id,name:d.name,group:d.group},reasons,missing,route,etaMin:mins,feasible:mins!==null&&mins<=left,reserved:d.reservedFor===r.id,score:(mins??9999)+missing.length*15}}).filter(Boolean).sort((a,b)=>a.score-b.score)}
function rankAmb(r,donor){const hosp=nearest(r.coords),left=(new Date(r.deadline)-Date.now())/6e4;
 return D.ambulances.filter(a=>a.available).map(a=>{const p=dijkstra(a.node,donor.node),h=dijkstra(donor.node,hosp);if(!p||!h)return null;const t=p.minutes+h.minutes;return{ambulance:a,pickup:p,toHospital:h,totalMin:+t.toFixed(1),feasible:t<=left}}).filter(Boolean).sort((a,b)=>a.totalMin-b.totalMin)}
const GROUPS=['A+','A-','B+','B-','AB+','AB-','O+','O-'],URG=['critical','urgent','routine'];
function localApi(path,method,b,h){b=b||{};const[p]=path.split('?'),role=KEYS[h['x-api-key']];expire();let m;
 const need=(...rs)=>{if(!role)throw new Error('Missing or invalid key');if(rs.length&&!rs.includes(role)&&role!=='admin')throw new Error('Role not permitted')};
 const req=id=>{const r=D.requests.find(x=>x.id===id);if(!r)throw new Error('Request not found');return r};
 const out=x=>{save();return JSON.parse(JSON.stringify(x))};
 if(p==='/webhooks/sms'){const from=String(b.from||''),word=String(b.body||'').trim().split(/\s+/)[0];
  const o=[...D.outreach].reverse().find(x=>x.phone===from);if(!o)return{ok:false,reason:'unknown sender'};const r=D.requests.find(x=>x.id===o.requestId);
  const reply=msg=>{sendSms(from,msg);return out({ok:true,status:o.status,reply:msg})};
  if(!['1','2'].includes(word))return reply('HILLLINK: Invalid reply. Reply 1 to express interest or 2 to decline.');
  if(o.status!=='sent')return reply('HILLLINK: We already recorded your reply.');
  if(!r||['expired','cancelled','completed'].includes(r.status)||Date.now()>o.expiresAt){o.status='late';return reply('HILLLINK: This request is no longer open. Thank you.')}
  if(word==='2'){o.status='declined';log('donor','declined',r.id,o.donorId);return reply('HILLLINK: Thanks. Recorded as declined.')}
  const d=D.donors.find(x=>x.id===o.donorId);if(r.donor||!matches(r).some(x=>x.donor.id===d.id)){o.status='late';return reply('HILLLINK: Thanks. Help is no longer needed from you for this request.')}
  o.status='accepted';r.donor=d.id;r.status='donor accepted';d.reservedFor=r.id;log('donor','reserved',r.id,d.id);return reply('HILLLINK: Thank you. Interest recorded. Hospital staff will confirm suitability and contact you.')}
 if(p==='/api/state'){need();return out({role,mode:'DEMO',nodes:NODES,edges:D.edges,hospitalNode:HN,requests:D.requests,donors:D.donors.map(d=>({...d,phone:d.phone.slice(0,-2)+'••'})),ambulances:D.ambulances,outbox:role==='hospital'?[]:D.outbox,audit:role==='admin'?D.audit:[]})}
 if(p==='/api/requests'&&method==='POST'){need('hospital');const key=h['idempotency-key'];if(key&&D.idem[key])return out(D.requests.find(r=>r.id===D.idem[key]));const err=[];
  if(!GROUPS.includes(b.bloodGroup))err.push('bloodGroup');if(!Object.keys(INTERVAL).includes(b.component))err.push('component');if(!(b.units>=1&&b.units<=20))err.push('units');
  if(!b.hospital||String(b.hospital).length>80)err.push('hospital');if(!URG.includes(b.urgency))err.push('urgency');if(!/^\+?\d{8,15}$/.test(b.phone||''))err.push('phone');if(isNaN(new Date(b.deadline))||new Date(b.deadline)<Date.now())err.push('deadline');
  if(err.length)throw new Error('Invalid fields: '+err.join(', '));
  const r={id:'R'+Math.random().toString(16).slice(2,8).toUpperCase(),bloodGroup:b.bloodGroup,component:b.component,units:+b.units,hospital:String(b.hospital),area:String(b.area||'').slice(0,60),coords:{lat:+b.lat||NODES[HN].lat,lon:+b.lon||NODES[HN].lon},deadline:new Date(b.deadline).toISOString(),urgency:b.urgency,phone:b.phone,verified:false,demo:true,status:'pending',createdAt:new Date().toISOString(),donor:null,ambulance:null};
  D.requests.unshift(r);if(key)D.idem[key]=r.id;log(role,'request_created',r.id,'demo (unverified)');return out(r)}
 if(m=p.match(/^\/api\/requests\/(\w+)\/(\w+)$/)){const r=req(m[1]),act=m[2];
  if(act==='verify'){need('hospital');r.verified=true;r.demo=false;log(role,'verified',r.id);return out(r)}
  if(act==='cancel'){need('hospital','dispatcher');r.status='cancelled';D.donors.forEach(d=>{if(d.reservedFor===r.id)d.reservedFor=null});D.ambulances.forEach(a=>{if(a.assignedTo===r.id){a.assignedTo=null;a.available=true}});log(role,'cancelled',r.id);return out(r)}
  if(act==='matches'){need('hospital','dispatcher');return{matches:matches(r)}}
  if(act==='outreach'){need('hospital','dispatcher');if(['expired','cancelled','completed'].includes(r.status))throw new Error('Request closed');
   const done=new Set(D.outreach.filter(o=>o.requestId===r.id).map(o=>o.donorId)),next=matches(r).filter(x=>x.feasible&&!done.has(x.donor.id)).slice(0,BATCH);if(!next.length)throw new Error('No further eligible donors in time');
   next.forEach(x=>{const d=D.donors.find(y=>y.id===x.donor.id);sendSms(d.phone,`HILLLINK BLOOD ALERT: A ${r.verified?'verified':'DEMO (unverified)'} hospital needs ${r.bloodGroup} blood at ${r.area||'hospital area'} by ${new Date(r.deadline).toLocaleTimeString()}. Reply 1 to express interest or 2 to decline. Request ID: ${r.id}. Do not reply with medical information.`);
    D.outreach.push({requestId:r.id,donorId:d.id,phone:d.phone,status:'sent',expiresAt:Date.now()+TIMEOUT_MIN*6e4})});
   if(r.status==='pending')r.status='matching';log(role,'outreach_sent',r.id,next.length+' mock SMS');return out({sent:next.length,mock:true})}
  if(act==='ambulances'){need('dispatcher');const d=D.donors.find(x=>x.id===r.donor);if(!d)throw new Error('No reserved donor');return out(rankAmb(r,d))}
  if(act==='ambulance'){need('dispatcher');const d=D.donors.find(x=>x.id===r.donor);if(!d)throw new Error('No reserved donor');if(r.ambulance)throw new Error('Ambulance already assigned');
   const rk=rankAmb(r,d),pick=b.override?rk.find(x=>x.ambulance.id===b.ambulanceId):rk.find(x=>x.feasible);if(!pick||!pick.ambulance.available)throw new Error('No available feasible ambulance (rechecked)');
   const a=D.ambulances.find(x=>x.id===pick.ambulance.id);a.available=false;a.assignedTo=r.id;r.ambulance=a.id;r.status='ambulance assigned';log(role,b.override?'ambulance_override':'ambulance_assigned',r.id,a.id);
   return out({...r,notice:'Recorded in HillLink only. No dispatch provider is integrated; contact the ambulance by your own channel.'})}
  if(act==='complete'){need('dispatcher','hospital');r.status='completed';D.ambulances.forEach(a=>{if(a.assignedTo===r.id){a.assignedTo=null;a.available=true}});D.donors.forEach(d=>{if(d.reservedFor===r.id)d.reservedFor=null});log(role,'completed',r.id);return out(r)}}
 if(p==='/api/admin/edge'){need('admin');const e=D.edges.find(x=>x.id===b.id);if(!e)throw new Error('Unknown edge');if(typeof b.closed==='boolean')e.closed=b.closed;if(b.rain>=0&&b.rain<=1)e.rain=+b.rain;log(role,'edge_update',e.id,JSON.stringify({closed:e.closed,rain:e.rain}));return out(e)}
 if(p==='/api/admin/reset'){need('admin');D=seed();return out({ok:true})}
 throw new Error('Unknown endpoint')}
//ENGINE-END
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MODE='local',S=null,tab='Overview',map,layers=[],q=JSON.parse(localStorage.hlQueue||'[]'),draft=JSON.parse(localStorage.hlDraft||'{}'),selected=null;
const tabs=['Overview','Requests','Donors','Matching','Admin'];$('#nav').innerHTML=tabs.map(t=>`<button data-t="${t}">${t}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};$('#role').onchange=load;
async function api(p,o={}){const headers={'content-type':'application/json','x-api-key':$('#role').value,...(o.headers||{})};
 if(MODE==='local')return localApi(p,o.method||'GET',o.body,headers);
 const r=await fetch(p.replace(/^\//,''),{method:o.method,headers,body:o.body?JSON.stringify(o.body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error+(j.fields?': '+j.fields.join(', '):''));return j}
async function load(){try{S=await api('/api/state');setConn(true);render()}catch(e){setConn(false);if(S)render()}}
function setConn(on){$('#conn').className='pill'+(on?'':' off');$('#conn span:last-child').textContent=MODE==='local'?'Standalone · data saved in this browser':on?'Server online':`Offline · ${q.length} queued · SMS still works without internet`;if(on&&MODE==='server')flush()}
async function flush(){while(q.length){const j=q[0];try{await api('/api/requests',{method:'POST',headers:{'idempotency-key':j.key},body:j.body});q.shift();localStorage.hlQueue=JSON.stringify(q)}catch(e){if(/Invalid/.test(e.message)){q.shift();localStorage.hlQueue=JSON.stringify(q)}else return}}}
const act=async(p,body)=>{try{const r=await api(p,{method:'POST',body:body||{}});if(r&&r.notice)alert(r.notice);await load();return r}catch(e){alert(e.message)}};
const stat=r=>`<span class="tag ${r.demo?'demo':'ok'}">${r.demo?'DEMO · unverified':'verified'}</span> <span class="tag">${H(r.status)}</span>`;
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#title').textContent=tab==='Overview'?'Emergency overview':tab;if(!S)return($('#view').innerHTML='<p>Cannot reach server.</p>');
 const open=S.requests.filter(r=>!['completed','cancelled','expired'].includes(r.status)),avail=S.donors.filter(d=>d.available&&d.consent).length,done=S.requests.filter(r=>r.status==='completed').length;let h='';
 if(tab==='Overview')h=`<div class="hero"><h3>See what’s confirmed.<br><span>Know what still needs a person.</span></h3><p>One workflow for fictional urgent requests across difficult terrain. Every uncertain step stays visible until a coordinator reviews it.</p><button class="btn" onclick="tab='Requests';render()">+ Create synthetic request</button></div>
 <div class="grid g4">${[['Open requests',open.length,'Need coordinator attention'],['Demo donor records',S.donors.length,'Synthetic sample only'],['Available in sample',avail,'Not clinical eligibility'],['Coordinated in demo',done,'Synthetic states recorded']].map(c=>`<div class="card"><div class="mut">${c[0]}</div><div class="num">${String(c[1]).padStart(2,'0')}</div><div class="mut">${c[2]}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h4>Priority requests</h4>${open.length?open.map(r=>`<div class="req"><b>${r.bloodGroup} ${r.component.replace(/_/g,' ')} ×${r.units}</b> · ${H(r.hospital)} ${stat(r)}</div>`).join(''):'<p class="mut" style="text-align:center;padding:30px">No requests to show. Create a synthetic case to get the workflow started.</p>'}<p class="mut">Matching is a listed group/component demo filter only. Clinical staff must confirm suitability and crossmatch.</p></div>`;
 if(tab==='Requests'){const d=draft,v=k=>H(d[k]||'');h=`<div class="grid g2"><form class="card" id="f" onsubmit="return false"><h4>New emergency request</h4><div class="mut">Hospital role only. Drafts save on this device.</div>
 <label>Blood group</label><select name="bloodGroup">${GROUPS.map(g=>`<option ${d.bloodGroup===g?'selected':''}>${g}</option>`)}</select>
 <label>Component</label><select name="component">${Object.keys(INTERVAL).map(g=>`<option ${d.component===g?'selected':''} value="${g}">${g.replace(/_/g,' ')}</option>`)}</select>
 <label>Units</label><input name="units" type="number" min="1" max="20" value="${v('units')||2}"><label>Hospital name</label><input name="hospital" value="${v('hospital')||'Demo District Hospital'}"><label>Hospital area (shared with donors)</label><input name="area" value="${v('area')||'Hospital area'}">
 <label>Latitude / longitude</label><div class="row" style="margin:0"><input name="lat" value="${v('lat')||27.085}"><input name="lon" value="${v('lon')||93.61}"></div>
 <label>Required arrival time</label><input name="deadline" type="datetime-local" value="${d.deadline||new Date(Date.now()+9e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}">
 <label>Urgency</label><select name="urgency">${URG.map(u=>`<option ${d.urgency===u?'selected':''}>${u}</option>`)}</select><label>Requester phone</label><input name="phone" value="${v('phone')||'+910000000000'}">
 <div class="row"><button class="btn" id="sub">Send request</button></div></form>
 <div class="card"><h4>Requests</h4>${S.requests.map(r=>`<div class="req"><b>${r.id}</b> ${r.bloodGroup} ${r.component.replace(/_/g,' ')} ×${r.units} · ${H(r.hospital)}<br>${stat(r)}<div class="mut">Deadline ${new Date(r.deadline).toLocaleString()}</div><div class="row">
 ${r.demo?`<button class="btn alt sm" onclick="act('/api/requests/${r.id}/verify')">Mark verified</button>`:''}<button class="btn alt sm" onclick="selected='${r.id}';tab='Matching';render()">Match donors</button><button class="btn alt sm" onclick="act('/api/requests/${r.id}/cancel')">Cancel</button></div></div>`).join('')||'<p class="mut">No requests yet.</p>'}</div></div>`}
 if(tab==='Donors')h=`<div class="card"><h4>Demo donor directory</h4><div style="overflow-x:auto"><table><tr><th>Name</th><th>Group</th><th>Phone</th><th>Consent</th><th>Available</th><th>Last donation</th><th>Screened</th><th>Location</th></tr>${S.donors.map(d=>`<tr><td>${H(d.name)}</td><td>${d.group}</td><td>${H(d.phone)}</td><td>${d.consent?'yes':'no'}</td><td>${d.available?'yes':'no'}</td><td>${d.lastDonationDays}d</td><td>${d.screened?'yes':'missing'}</td><td>${d.locConfidence}</td></tr>`).join('')}</table></div></div>`;
 if(tab==='Matching')h=`<div class="grid g2"><div class="card"><h4>Request</h4><select onchange="selected=this.value;render()"><option value="">Choose…</option>${S.requests.map(r=>`<option ${r.id===selected?'selected':''} value="${r.id}">${r.id} · ${r.bloodGroup} · ${r.status}</option>`)}</select><div id="mres"></div></div><div class="card"><h4>Road map</h4><div id="map"></div><div id="rinfo" class="mut"></div><div class="note">Times are estimates from a synthetic road graph (Dijkstra on time-weighted edges), not live traffic or weather.</div></div></div>`;
 if(tab==='Admin')h=`<div class="grid g2"><div class="card"><h4>Road conditions (weather / closures)</h4><div style="max-height:420px;overflow:auto"><table>${S.edges.map(e=>`<tr><td>${e.id}<div class="mut">${e.type} · ${e.km}km</div></td><td><select onchange="act('/api/admin/edge',{id:'${e.id}',rain:+this.value})" style="min-height:0"><option value="0" ${!e.rain?'selected':''}>dry</option><option value="0.5" ${e.rain==.5?'selected':''}>rain</option><option value="1" ${e.rain==1?'selected':''}>heavy</option></select></td><td><button class="btn alt sm" onclick="act('/api/admin/edge',{id:'${e.id}',closed:${!e.closed}})">${e.closed?'Reopen':'Close'}</button></td></tr>`).join('')}</table></div><div class="row"><button class="btn bad sm" onclick="confirm('Reset demo data?')&&act('/api/admin/reset')">Reset demo</button></div></div>
 <div class="card"><h4>Mock SMS outbox (not real deliveries)</h4>${S.outbox.slice(0,8).map(m=>`<div class="req mut"><b>To ${H(m.to)}</b> [MOCK]<br>${H(m.body)}</div>`).join('')||'<p class="mut">Empty, or hidden from hospital role.</p>'}
 <h4 style="margin-top:14px">Simulate donor reply</h4><div class="row"><input id="sp" placeholder="+9100000000.." style="max-width:200px"><button class="btn alt sm" onclick="sim('1')">Reply 1</button><button class="btn alt sm" onclick="sim('2')">Reply 2</button><button class="btn alt sm" onclick="sim('hello')">Invalid</button></div><h4 style="margin-top:14px">Audit log</h4><div style="max-height:200px;overflow:auto" class="mut">${S.audit.map(a=>`${a.at.slice(11,19)} ${a.actor} ${a.action} ${a.ref||''} ${H(a.detail||'')}<br>`).join('')||'Admin role only.'}</div></div></div>`;
 $('#view').innerHTML=h;
 if(tab==='Requests'){const f=$('#f');f.oninput=()=>{draft=Object.fromEntries(new FormData(f));localStorage.hlDraft=JSON.stringify(draft)};$('#sub').onclick=submit}
 if(tab==='Matching'){initMap();if(selected)match()}}
async function submit(){const b=Object.fromEntries(new FormData($('#f')));b.deadline=new Date(b.deadline).toISOString();const key=crypto.randomUUID?crypto.randomUUID():String(Date.now());
 try{await api('/api/requests',{method:'POST',headers:{'idempotency-key':key},body:b});localStorage.removeItem('hlDraft');draft={};await load();tab='Overview';render()}
 catch(e){if(MODE==='local'||/Invalid|key|permitted/.test(e.message))return alert(e.message);q.push({key,body:b});localStorage.hlQueue=JSON.stringify(q);setConn(false);alert('No connection. Request queued and will be sent when online.')}}
async function sim(w){try{const r=await api('/webhooks/sms',{method:'POST',body:{from:$('#sp').value.trim(),body:w}});alert(r.reply||r.reason);load()}catch(e){alert(e.message)}}
function initMap(){if(!window.L)return $('#map').innerHTML='<p class="mut" style="padding:20px">Map needs internet to load. Matching data still works.</p>';map=L.map('map').setView([27.085,93.61],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
 S.edges.forEach(e=>L.polyline([[S.nodes[e.a].lat,S.nodes[e.a].lon],[S.nodes[e.b].lat,S.nodes[e.b].lon]],{color:e.closed?'#c4452f':e.rain?'#e2873b':'#6b8f8b',weight:3,dashArray:e.closed?'6':null}).addTo(map).bindTooltip(`${e.id} ${e.type}${e.closed?' CLOSED':''}`));
 L.marker([S.nodes[S.hospitalNode].lat,S.nodes[S.hospitalNode].lon]).addTo(map).bindTooltip('Hospital')}
async function match(){const r=S.requests.find(x=>x.id===selected);if(!r)return;let m;try{m=(await api(`/api/requests/${r.id}/matches`)).matches}catch(e){return $('#mres').innerHTML=`<div class="note">${H(e.message)}</div>`}
 window._r={};m.forEach(x=>window._r[x.donor.id]=x);
 $('#mres').innerHTML=`${stat(r)}<div class="note">Blood-bank staff must confirm final suitability.${r.demo?' Unverified: alerts are demo only.':''}</div>`+(m.map(x=>`<div class="req"><b>${H(x.donor.name)}</b> ${x.donor.group} · ETA ${x.etaMin??'unreachable'} min <span class="tag ${x.feasible?'ok':'bad'}">${x.feasible?'before deadline':'too late'}</span> ${x.reserved?'<span class="tag ok">reserved</span>':''}
 <div class="mut">${x.reasons.map(H).join('; ')}</div>${x.missing.length?`<div class="mut" style="color:var(--bad)">Missing: ${x.missing.map(H).join('; ')}</div>`:''}<button class="btn alt sm" onclick="show('${x.donor.id}')">Show route</button></div>`).join('')||'<p class="mut">No eligible donors.</p>')
 +`<div class="row"><button class="btn sm" onclick="act('/api/requests/${r.id}/outreach')">Send SMS batch (mock)</button></div>`+(r.donor?`<h4 style="margin-top:14px">Ambulance</h4><div id="amb" class="mut"></div>`:'');if(r.donor)amb(r)}
function show(id){const x=window._r[id];if(!map||!x||!x.route)return alert('No route available');layers.forEach(l=>l.remove());layers=[L.polyline(x.route.path,{color:'#16766b',weight:6}).addTo(map)];map.fitBounds(layers[0].getBounds());$('#rinfo').textContent=`Estimated ${x.route.minutes} min · ${x.route.km} km · data time ${new Date(x.route.at).toLocaleTimeString()} (estimate)`}
async function amb(r){try{const a=await api(`/api/requests/${r.id}/ambulances`);$('#amb').innerHTML=a.map(x=>`<div class="req">${H(x.ambulance.name)} · pickup ${x.pickup.minutes} + hospital ${x.toHospital.minutes} = ${x.totalMin} min <span class="tag ${x.feasible?'ok':'bad'}">${x.feasible?'feasible':'late'}</span> <button class="btn alt sm" onclick="act('/api/requests/${r.id}/ambulance',{override:true,ambulanceId:'${x.ambulance.id}'})">Assign</button></div>`).join('')+`<div class="row"><button class="btn sm" onclick="act('/api/requests/${r.id}/ambulance')">Assign best feasible</button><button class="btn alt sm" onclick="act('/api/requests/${r.id}/complete')">Mark completed</button></div><div class="note">Assignment is recorded here only; no dispatch is sent.</div>`}catch(e){$('#amb').textContent=e.message+' (dispatcher role required)'}}
addEventListener('online',()=>MODE==='server'&&flush());addEventListener('offline',()=>MODE==='server'&&setConn(false));
(async()=>{try{const r=await fetch('api/state',{headers:{'x-api-key':'demo-hospital'}});await r.json();MODE='server'}catch(e){MODE='local'}await load();setInterval(load,15000)})();
</script></body></html>
