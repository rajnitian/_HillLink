<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillLink</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--side:#0f3b3f;--side2:#164c4e;--ink:#0d3338;--mut:#5d7476;--bg:#f3f6f4;--card:#fffdf9;--acc:#16766b;--mint:#7fe0b0;--warn:#e2873b;--bad:#c4452f;--line:#dfe6e2}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:260px;background:var(--side);color:#cfe5e0;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h1{margin:0 0 18px 8px;font-size:26px;color:#fff}aside h1 small{display:block;font:11px monospace;letter-spacing:.12em;color:#8fb5ae}
nav button{all:unset;display:block;width:100%;padding:13px 14px;border-radius:8px;cursor:pointer;box-sizing:border-box}nav button.on{background:var(--side2);outline:1px solid #2b6b68;color:#fff}nav button:focus-visible{outline:2px solid var(--mint)}
.sim{margin-top:auto;border:1px solid #2b6b68;border-radius:10px;padding:14px;font-size:13px}.sim b{color:#fff}
main{flex:1;padding:28px 36px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
header h2{margin:0;font-size:32px;letter-spacing:-.02em}.pill{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:6px}.off .dot{background:var(--bad)}
.hero{background:#174b4f;color:#fff;border-radius:14px;padding:34px 40px;margin-bottom:20px}.hero h3{font-size:42px;line-height:1.05;margin:0 0 12px;letter-spacing:-.03em}.hero h3 span{color:var(--mint)}.hero p{max-width:560px;color:#d4e8e3}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:13px 20px;font:600 16px inherit;cursor:pointer;min-height:48px}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.5}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card h4{margin:0 0 4px;font-size:18px}.num{font-size:36px;font-weight:700}.mut{color:var(--mut);font-size:13px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}input,select{width:100%;padding:12px;border:1px solid #c8d4cf;border-radius:8px;font:inherit;background:#fff;min-height:48px}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:#e3efe9}.tag.demo{background:#fbe5d0;color:#8a4a10}.tag.ok{background:#d5f1e1}.tag.bad{background:#f6d9d3}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#map{height:380px;border-radius:12px;border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.note{background:#fff3e3;border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.req{border-top:1px solid var(--line);padding:12px 0}.hide{display:none}
@media(max-width:800px){body{display:block}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}aside h1,.sim{display:none}nav{display:flex;flex-wrap:wrap}main{padding:16px}.hero h3{font-size:30px}}
</style></head><body>
<aside><h1>HillLink<small>FIELD COORDINATION</small></h1><nav id="nav"></nav><div class="sim"><b>Simulation only</b><br>Mock SMS, synthetic people, no real dispatch. Verification and approvals are fictional until real providers are connected.</div></aside>
<main><header><div><div class="mut">Regional response / Arunachal Pradesh</div><h2 id="title">Emergency overview</h2></div>
<div class="row" style="margin:0"><span class="pill" id="conn"><span class="dot"></span><span>Online</span></span><span class="pill">Role <select id="role" style="width:auto;min-height:0;padding:2px"><option value="demo-hospital">hospital</option><option value="demo-dispatcher">dispatcher</option><option value="demo-admin">admin</option></select></span></div></header>
<div id="view"></div></main>
<script>
const $=s=>document.querySelector(s),H=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,tab='Overview',map,layers=[],q=JSON.parse(localStorage.hlQueue||'[]'),draft=JSON.parse(localStorage.hlDraft||'{}'),selected=null,detail=null;
const tabs=['Overview','Requests','Donors','Matching','Admin'];$('#nav').innerHTML=tabs.map(t=>`<button data-t="${t}">${t}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};$('#role').onchange=load;
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'content-type':'application/json','x-api-key':$('#role').value,...(o.headers||{})},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error+(j.fields?': '+j.fields.join(', '):''));return j};
async function load(){try{S=await api('/api/state');setConn(true);render()}catch(e){setConn(false);if(S)render()}}
function setConn(on){$('#conn').className='pill'+(on?'':' off');$('#conn span:last-child').textContent=on?'Online':`Offline · ${q.length} queued · SMS still works without internet`;if(on)flush()}
async function flush(){while(q.length){const j=q[0];try{await api('/api/requests',{method:'POST',headers:{'idempotency-key':j.key},body:j.body});q.shift();localStorage.hlQueue=JSON.stringify(q)}catch(e){if(/Invalid/.test(e.message)){q.shift();localStorage.hlQueue=JSON.stringify(q);alert('Dropped invalid queued request: '+e.message)}else return}}load()}
const act=async(p,body)=>{try{const r=await api(p,{method:'POST',body:body||{}});if(r.notice)alert(r.notice);await load();return r}catch(e){alert(e.message)}};
const stat=r=>`<span class="tag ${r.demo?'demo':'ok'}">${r.demo?'DEMO · unverified':'verified'}</span> <span class="tag">${H(r.status)}</span>`;
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#title').textContent=tab==='Overview'?'Emergency overview':tab;if(!S)return($('#view').innerHTML='<p>Cannot reach server.</p>');
 const open=S.requests.filter(r=>!['completed','cancelled','expired'].includes(r.status)),avail=S.donors.filter(d=>d.available&&d.consent).length,done=S.requests.filter(r=>r.status==='completed').length;
 let h='';
 if(tab==='Overview')h=`<div class="hero"><h3>See what’s confirmed.<br><span>Know what still needs a person.</span></h3><p>One workflow for fictional urgent requests across difficult terrain. Every uncertain step stays visible until a coordinator reviews it.</p><button class="btn" onclick="tab='Requests';render()">+ Create synthetic request</button></div>
 <div class="grid g4">${[['Open requests',open.length,'Need coordinator attention'],['Demo donor records',S.donors.length,'Synthetic sample only'],['Available in sample',avail,'Not clinical eligibility'],['Coordinated in demo',done,'Synthetic states recorded']].map(c=>`<div class="card"><div class="mut">${c[0]}</div><div class="num">${String(c[1]).padStart(2,'0')}</div><div class="mut">${c[2]}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h4>Priority requests</h4>${open.length?open.map(r=>`<div class="req"><b>${r.bloodGroup} ${r.component.replace(/_/g,' ')} ×${r.units}</b> · ${H(r.hospital)} ${stat(r)}</div>`).join(''):'<p class="mut" style="text-align:center;padding:30px">No requests to show. Create a synthetic case to get the workflow started.</p>'}
 <p class="mut">Matching is a listed group/component demo filter only. Clinical staff must confirm suitability and crossmatch.</p></div>`;
 if(tab==='Requests'){const d=draft,v=k=>H(d[k]||'');h=`<div class="grid g2"><form class="card" id="f" onsubmit="return false"><h4>New emergency request</h4><div class="mut">Drafts save on this device. Submit retries automatically when back online.</div>
 <label>Blood group</label><select name="bloodGroup">${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(g=>`<option ${d.bloodGroup===g?'selected':''}>${g}</option>`)}</select>
 <label>Component</label><select name="component">${['whole_blood','packed_red_cells','platelets','plasma'].map(g=>`<option ${d.component===g?'selected':''} value="${g}">${g.replace(/_/g,' ')}</option>`)}</select>
 <label>Units</label><input name="units" type="number" min="1" max="20" value="${v('units')||2}"><label>Hospital name</label><input name="hospital" value="${v('hospital')||'Demo District Hospital'}"><label>Hospital area (shared with donors)</label><input name="area" value="${v('area')||'Hospital area'}">
 <label>Latitude / longitude</label><div class="row" style="margin:0"><input name="lat" value="${v('lat')||27.085}"><input name="lon" value="${v('lon')||93.61}"></div>
 <label>Required arrival time</label><input name="deadline" type="datetime-local" value="${d.deadline||new Date(Date.now()+9e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}">
 <label>Urgency</label><select name="urgency"><option>critical</option><option>urgent</option><option>routine</option></select><label>Requester phone</label><input name="phone" value="${v('phone')||'+910000000000'}">
 <div class="row"><button class="btn" id="sub">Send request</button></div></form>
 <div class="card"><h4>Requests</h4>${S.requests.map(r=>`<div class="req"><b>${r.id}</b> ${r.bloodGroup} ${r.component.replace(/_/g,' ')} ×${r.units} · ${H(r.hospital)}<br>${stat(r)}<div class="mut">Deadline ${new Date(r.deadline).toLocaleString()}</div><div class="row">
 ${r.demo?`<button class="btn alt" onclick="act('/api/requests/${r.id}/verify')">Mark verified</button>`:''}<button class="btn alt" onclick="selected='${r.id}';tab='Matching';render()">Match donors</button><button class="btn alt" onclick="act('/api/requests/${r.id}/cancel')">Cancel</button></div></div>`).join('')||'<p class="mut">No requests yet.</p>'}</div></div>`}
 if(tab==='Donors')h=`<div class="card"><h4>Demo donor directory</h4><table><tr><th>Name</th><th>Group</th><th>Phone</th><th>Consent</th><th>Available</th><th>Last donation</th><th>Screened</th><th>Location</th></tr>${S.donors.map(d=>`<tr><td>${H(d.name)}</td><td>${d.group}</td><td>${H(d.phone)}</td><td>${d.consent?'yes':'no'}</td><td>${d.available?'yes':'no'}</td><td>${d.lastDonationDays}d</td><td>${d.screened?'yes':'missing'}</td><td>${d.locConfidence}</td></tr>`).join('')}</table></div>`;
 if(tab==='Matching'){h=`<div class="grid g2"><div class="card"><h4>Request</h4><select id="sel" onchange="selected=this.value;detail=null;render()"><option value="">Choose…</option>${S.requests.map(r=>`<option ${r.id===selected?'selected':''} value="${r.id}">${r.id} · ${r.bloodGroup} · ${r.status}</option>`)}</select><div id="mres"></div></div><div class="card"><h4>Road map</h4><div id="map"></div><div id="rinfo" class="mut"></div><div class="note">Times are estimates from a synthetic road graph with Dijkstra on time-weighted edges, not live traffic.</div></div></div>`}
 if(tab==='Admin')h=`<div class="grid g2"><div class="card"><h4>Road conditions (weather / closures)</h4><table>${S.edges.map(e=>`<tr><td>${e.id}<div class="mut">${e.type} · ${e.km}km</div></td><td><select onchange="act('/api/admin/edge',{id:'${e.id}',rain:+this.value})" style="min-height:0"><option value="0" ${!e.rain?'selected':''}>dry</option><option value="0.5" ${e.rain==.5?'selected':''}>rain</option><option value="1" ${e.rain==1?'selected':''}>heavy</option></select></td><td><button class="btn alt" style="min-height:0;padding:6px 10px" onclick="act('/api/admin/edge',{id:'${e.id}',closed:${!e.closed}})">${e.closed?'Reopen':'Close'}</button></td></tr>`).join('')}</table><div class="row"><button class="btn bad" onclick="confirm('Reset demo data?')&&act('/api/admin/reset')">Reset demo</button></div></div>
 <div class="card"><h4>Mock SMS outbox (not real deliveries)</h4>${S.outbox.slice(0,8).map(m=>`<div class="req mut"><b>To ${H(m.to)}</b> [MOCK]<br>${H(m.body)}</div>`).join('')||'<p class="mut">Empty (hidden from hospital role).</p>'}
 <h4 style="margin-top:14px">Simulate donor reply</h4><div class="row"><input id="sp" placeholder="+9100000000.." style="max-width:200px"><button class="btn alt" onclick="sim('1')">Reply 1</button><button class="btn alt" onclick="sim('2')">Reply 2</button></div><h4 style="margin-top:14px">Audit log</h4><div style="max-height:200px;overflow:auto" class="mut">${S.audit.map(a=>`${a.at.slice(11,19)} ${a.actor} ${a.action} ${a.ref||''} ${H(a.detail||'')}<br>`).join('')||'Admin role only.'}</div></div></div>`;
 $('#view').innerHTML=h;
 if(tab==='Requests'){const f=$('#f');f.oninput=()=>{draft=Object.fromEntries(new FormData(f));localStorage.hlDraft=JSON.stringify(draft)};$('#sub').onclick=submit}
 if(tab==='Matching'){initMap();if(selected)match()}}
async function submit(){const b=Object.fromEntries(new FormData($('#f')));b.deadline=new Date(b.deadline).toISOString();const key=crypto.randomUUID();
 try{await api('/api/requests',{method:'POST',headers:{'idempotency-key':key},body:b});localStorage.removeItem('hlDraft');draft={};load()}catch(e){if(/Invalid|key|permitted/.test(e.message))return alert(e.message);q.push({key,body:b});localStorage.hlQueue=JSON.stringify(q);setConn(false);alert('No connection. Request queued and will be sent when online.')}}
async function sim(w){const r=await fetch('/webhooks/sms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:$('#sp').value,body:w})}).then(r=>r.json());alert(r.reply||r.reason);load()}
function initMap(){if(!window.L)return $('#map').innerHTML='<p class="mut" style="padding:20px">Map tiles need internet. Matching data still works.</p>';map=L.map('map').setView([27.085,93.61],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
 S.edges.forEach(e=>L.polyline([[S.nodes[e.a].lat,S.nodes[e.a].lon],[S.nodes[e.b].lat,S.nodes[e.b].lon]],{color:e.closed?'#c4452f':e.rain?'#e2873b':'#6b8f8b',weight:3,dashArray:e.closed?'6':null}).addTo(map).bindTooltip(`${e.id} ${e.type}${e.closed?' CLOSED':''}`));
 L.marker([S.nodes[S.hospitalNode].lat,S.nodes[S.hospitalNode].lon]).addTo(map).bindTooltip('Hospital')}
async function match(){const r=S.requests.find(x=>x.id===selected);if(!r)return;let m;try{m=(await api(`/api/requests/${r.id}/matches`)).matches}catch(e){return $('#mres').innerHTML=`<div class="note">${H(e.message)}</div>`}
 $('#mres').innerHTML=`${stat(r)}<div class="note">Blood-bank staff must confirm final suitability.${r.demo?' Unverified: alerts are demo only.':''}</div>`+m.map(x=>`<div class="req"><b>${H(x.donor.name)}</b> ${x.donor.group} · ETA ${x.etaMin??'unreachable'} min <span class="tag ${x.feasible?'ok':'bad'}">${x.feasible?'before deadline':'too late'}</span> ${x.reserved?'<span class="tag ok">reserved</span>':''}
 <div class="mut">${x.reasons.map(H).join('; ')}</div>${x.missing.length?`<div class="mut" style="color:var(--bad)">Missing: ${x.missing.map(H).join('; ')}</div>`:''}<button class="btn alt" style="min-height:0;padding:4px 10px" onclick='show(${JSON.stringify(x.route?.path||[])},${x.etaMin})'>Route</button></div>`).join('')||'<p class="mut">No eligible donors.</p>'
 +`<div class="row"><button class="btn" onclick="act('/api/requests/${r.id}/outreach')">Send SMS batch (mock)</button></div>`
 +(r.donor?`<h4 style="margin-top:14px">Ambulance</h4><div id="amb" class="mut"></div>`:'');
 if(r.donor)amb(r)}
function show(p,t){if(!map||!p.length)return alert('No route available');layers.forEach(l=>l.remove());layers=[L.polyline(p,{color:'#16766b',weight:6}).addTo(map)];map.fitBounds(layers[0].getBounds());$('#rinfo').textContent=`Estimated ${t} min · updated ${new Date().toLocaleTimeString()}`}
async function amb(r){try{const a=await api(`/api/requests/${r.id}/ambulances`);$('#amb').innerHTML=a.map(x=>`<div class="req">${H(x.ambulance.name)} · total ${x.totalMin} min <span class="tag ${x.feasible?'ok':'bad'}">${x.feasible?'feasible':'late'}</span> <button class="btn alt" style="min-height:0;padding:4px 10px" onclick="act('/api/requests/${r.id}/ambulance',{override:true,ambulanceId:'${x.ambulance.id}'})">Assign</button></div>`).join('')+`<div class="row"><button class="btn" onclick="act('/api/requests/${r.id}/ambulance')">Assign best feasible</button><button class="btn alt" onclick="act('/api/requests/${r.id}/complete')">Mark completed</button></div><div class="note">Assignment is recorded here only; no dispatch is sent.</div>`}catch(e){$('#amb').textContent=e.message+' (dispatcher role required)'}}
addEventListener('online',flush);addEventListener('offline',()=>setConn(false));load();setInterval(load,15000);
</script></body></html>
